project_id = "edurelay"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep this aligned with the hosted project: a local PG 16 running against a
# hosted PG 15 hides upgrade problems until deploy day.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "https://edurelay.tn"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_confirmations = false # local only; production requires email confirmation

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.github]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
# pg_cron is what releases the 48 h escrow window; it must exist locally too.
orioledb_version = ""
s3_host = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
