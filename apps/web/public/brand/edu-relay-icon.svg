<svg width="320" height="320" viewBox="0 0 320 320"
     xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EduRelay icon</title>
  <desc>EduRelay icon mark — two books with a relay arrow and two figures</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      :root {
        --brand:      #1D9E75;
        --brand-dark: #085041;
        --accent:     #EF9F27;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --brand:      #5DCAA5;
          --brand-dark: #9FE1CB;
          --accent:     #FAC775;
        }
      }
      svg[data-theme="dark"] {
        --brand:      #5DCAA5;
        --brand-dark: #9FE1CB;
        --accent:     #FAC775;
      }
    </style>
  </defs>

  <!-- Background square -->
  <rect x="0" y="0" width="320" height="320" rx="64" fill="var(--brand)"/>

  <!-- Left book -->
  <rect x="40" y="64" width="96" height="120" rx="10" fill="white" opacity="0.9"/>
  <rect x="46" y="70" width="42" height="108" rx="6" fill="var(--brand-dark)" opacity="0.6"/>
  <rect x="92" y="70" width="38" height="108" rx="6" fill="white" opacity="0.5"/>
  <line x1="56" y1="94"  x2="84" y2="94"  stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="56" y1="106" x2="84" y2="106" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="56" y1="118" x2="84" y2="118" stroke="white" stroke-width="3" opacity="0.5"/>

  <!-- Relay arrow -->
  <path d="M144 118 Q160 88 176 118" fill="none" stroke="var(--accent)"
        stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.95"/>

  <!-- Right book -->
  <rect x="184" y="64" width="96" height="120" rx="10" fill="white" opacity="0.9"/>
  <rect x="190" y="70" width="42" height="108" rx="6" fill="var(--brand-dark)" opacity="0.6"/>
  <rect x="236" y="70" width="38" height="108" rx="6" fill="white" opacity="0.5"/>
  <line x1="200" y1="94"  x2="228" y2="94"  stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="200" y1="106" x2="228" y2="106" stroke="white" stroke-width="3" opacity="0.7"/>
  <line x1="200" y1="118" x2="228" y2="118" stroke="white" stroke-width="3" opacity="0.5"/>

  <!-- Left person -->
  <circle cx="88" cy="214" r="16" fill="white" opacity="0.85"/>
  <path d="M88 230 L88 258 M72 242 L104 242 M88 258 L78 280 M88 258 L98 280"
        stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Right person -->
  <circle cx="232" cy="214" r="16" fill="white" opacity="0.85"/>
  <path d="M232 230 L232 258 M216 242 L248 242 M232 258 L222 280 M232 258 L242 280"
        stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>

</svg>
