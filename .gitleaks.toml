# Gitleaks configuration — EduRelay
# Run: gitleaks git --config .gitleaks.toml --redact --verbose
# CI runs the same command on every push and on a nightly full-history scan.
# Docs: https://github.com/gitleaks/gitleaks

[extend]
# Keep the upstream ruleset (AWS, Stripe, GitHub, private keys, …) and add
# project-specific ones below.
useDefault = true

[[rules]]
id = "supabase-service-role-key"
description = "Supabase service-role JWT or sb_secret_* key. Full database access."
regex = '''(?i)(service[_-]?role[^\n]{0,40})?(sb_secret_[A-Za-z0-9_-]{20,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})'''
entropy = 3.5
keywords = ["service_role", "sb_secret", "supabase"]

[[rules]]
id = "supabase-db-url"
description = "Postgres connection string with an embedded password."
regex = '''postgres(ql)?://[^\s:@/]+:[^\s:@/]{8,}@'''
keywords = ["postgres://", "postgresql://"]

[[rules]]
id = "tunisian-bank-rib"
description = "Tunisian RIB (20 digits) — payout destination, must never be in code."
regex = '''\b\d{20}\b'''
keywords = ["rib", "iban", "payout", "bank"]

[[rules]]
id = "konnect-paymee-secret"
description = "Payment gateway secret or webhook signing key."
regex = '''(?i)(konnect|paymee)[_-]?(api|secret|webhook)[_-]?(key|token)?\s*[:=]\s*["']?[A-Za-z0-9_\-\.]{16,}'''
keywords = ["konnect", "paymee"]

# ---------------------------------------------------------------------------
# Allowlist — placeholder values and fixtures only. Never add a real secret.
# ---------------------------------------------------------------------------
[allowlist]
description = "Documented placeholders and synthetic test data."
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/''',
  '''(^|/)README\.md$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
regexes = [
  '''(?i)(your[-_]|<your|changeme|placeholder|example\.com|xxx+|\.\.\.)''',
  '''sb_publishable_[A-Za-z0-9_-]+''', # publishable keys are public by design
]
